# This is a basic workflow to help you get started with Actions

name: CI

# Controls when the workflow will run
on:
  # Triggers the workflow on push or pull request events but only for the "main" branch
  push:
    branches: ["main", "dev"]
  pull_request:
    branches: ["main", "dev"]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# A workflow run is made up of one or more jobs that can run sequentially or in parallel
jobs:
  # This workflow contains a single job called "build"
  build:
    # The type of runner that the job will run on
    runs-on: ubuntu-latest
    # Allow skipping ci
    if: "!contains(github.event.pull_request.title, '[ci skip]') && !contains(github.event.pull_request.body, '[ci skip]')"

    # Steps represent a sequence of tasks that will be executed as part of the job
    steps:
      - uses: actions/checkout@v5
      - uses: haskell-actions/setup@v2
        id: setup
        with:
          ghc-version: "9.10.2"
          cabal-version: "3.16.1.0"
      - uses: actions/cache@v4
        with:
          path: |
            ${{ steps.setup.outputs.cabal-store }}
            dist-newstyle
          key: ${{ runner.os }}-ghc-9.10.2-${{ hashFiles('forsyde-devtools.cabal', 'cabal.project') }}
          restore-keys: ${{ runner.os }}-ghc-9.10.2-

        # Runs a set of commands using the runners shell
      - name: Build and test the compiler
        run: |
          git fetch origin dev
          if git diff --stat origin/dev -- | grep '\(^ src\|^ test\|^ forsyde-devtools.cabal\|^ cabal.project\|^ scripts\|^ examples\|^ .github/workflows/build.yml\)'; then
            cabal build
            cabal test
            ./scripts/test.sh --cabal
          fi
