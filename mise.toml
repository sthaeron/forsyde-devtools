[tools]
ghcup = "0.2.6.2"
ormolu = "0.8.2.0"
"github:tfausak/cabal-gild" = "1.8.4.2"
uv = "latest"

[env]
_.path = ["~/.ghcup/bin"]

[tasks.setup]
description = "Install GHC, cabal and HLS through ghcup, enable git hooks"
run = [
  "ghcup install ghc 9.10.2 --set",
  "ghcup install cabal 3.16.1.0 --set",
  "ghcup install hls 2.11.0.0 --set",
  "git config core.hooksPath .githooks",
]

[tasks.docs]
description = "Serve the documentation site"
run = "uvx --with mkdocs-material --with mkdocs-mermaid2-plugin mkdocs serve"
